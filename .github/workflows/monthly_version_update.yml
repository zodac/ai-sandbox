name: Monthly Dependency Update

# Debian removes a superseded package version from its repositories, so a pin that nothing moves stops
# installing, and every host without the base image already built then fails its first launch (and so does
# the Publish workflow's clean build). This bumps the pins - and the GitHub Actions - monthly, proves the
# images build, and pushes to master, which releases them through the Publish workflow. It runs the day
# before the consuming projects' own monthly updates (the 2nd), so those pick up the new tag.

on:
  schedule:
    # Runs on the 1st of every month at 03:00 UTC
    - cron: "0 3 1 * *"
  workflow_dispatch: # allows manual trigger

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Mint a short-lived installation token from the org-owned GitHub App. It carries `workflows: write`
      # (needed to push a bumped `uses:` line), which the default GITHUB_TOKEN lacks - and, unlike a
      # GITHUB_TOKEN push, its push to master starts the Publish workflow, which tags the release.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.3.0
        with:
          client-id: ${{ vars.GH_INTEGRATION_APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git user
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

      - name: Update all dependency versions
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        # android-gradle is left out: its image is too large to prove on a hosted runner, and an unproven
        # bump must not reach a release. Bump it locally (the script's default) and build it there.
        run: .github/scripts/update_dependency_versions.sh --skip-android-gradle

      - name: Check for changes
        id: changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prove the new pins build
        if: steps.changes.outputs.changed == 'true'
        env:
          PROJECT_DIR: ${{ github.workspace }}
          SANDBOX_CONFIG_DIR: ${{ github.workspace }}/examples/java-maven
        run: ./sandbox.sh build

      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          git add -A
          git commit -m "[CI] Updating dependency versions"

      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        uses: ad-m/github-push-action@v1.3.0
        with:
          branch: master
          github_token: ${{ steps.app-token.outputs.token }}
