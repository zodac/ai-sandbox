name: Update Versions

# Debian removes a superseded package version from its repositories, so a pin that nothing moves stops
# installing, and every host without the base image already built then fails its first launch. This bumps
# the pins monthly, proves they build, and releases them. It runs the day before the consuming projects'
# own monthly updates (the 2nd), so those pick up the new tag.

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write # To start the Publish workflow: a push made with GITHUB_TOKEN does not trigger one

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Bump the version pins
        # android-gradle is left out: its image is too large to prove on a hosted runner, and an unproven
        # bump must not reach a release.
        run: scripts/update-versions.sh image/base/Dockerfile examples/java-maven/Dockerfile

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Prove the new pins build
        if: steps.changes.outputs.changed == 'true'
        env:
          PROJECT_DIR: ${{ github.workspace }}
          SANDBOX_CONFIG_DIR: ${{ github.workspace }}/examples/java-maven
        run: ./sandbox.sh build

      - name: Commit and push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add image/base/Dockerfile examples/java-maven/Dockerfile
          git commit -m "[CI] Updating dependency versions"
          git push origin HEAD:master

      - name: Release
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref master
