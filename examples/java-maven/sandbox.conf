# Example settings: a Java/Maven service with a Node frontend and Playwright tests (taken from
# Diurnal's sandbox). See ai-sandbox/templates/configuration/sandbox.conf for each setting.

# The in-sandbox dev server runs on container :8081 (e.g. scripts/dev-up.sh); published on host :8071,
# deliberately NOT :8081, so the host's own 8081 stays free for host-native dev/tests.
SANDBOX_PORTS="8071:8081"

# m2: the Maven local repository; pw: Playwright's Chromium (setup.d/20-playwright.sh).
SANDBOX_CACHE_VOLUMES="m2:/home/dev/.m2 pw:/home/dev/.cache/ms-playwright"

# npm ci on each open (when the lockfile changed) in the frontend and the Playwright tests.
SANDBOX_NPM_DIRS="frontend tests"

# The Dockerfile's PLAYWRIGHT_VERSION follows the version the tests pin; its build context cannot read it.
playwright_version="$(sed -nE 's/.*"@playwright\/test": *"([0-9][^"]*)".*/\1/p' "${PROJECT_DIR}/tests/package.json" 2>/dev/null || true)"
SANDBOX_BUILD_ARGS="${playwright_version:+PLAYWRIGHT_VERSION=${playwright_version}}"

SANDBOX_ENV=""
SANDBOX_RUN_ARGS=""

# Days of Claude session history to keep (see the template).
SANDBOX_HISTORY_DAYS=14
