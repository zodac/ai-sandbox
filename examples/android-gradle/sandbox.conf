# Example settings: an Android app built with Gradle (taken from DiceFive's sandbox).
# See ai-sandbox/templates/configuration/sandbox.conf for what each setting means.

# No in-sandbox server, so nothing is published.
SANDBOX_PORTS=""

# gradle: the Gradle distribution + every AGP/Kotlin/AndroidX/Compose dependency (the slow part of a
#         first build); m2: the android-all jars Robolectric downloads (~600MB); pw: a Playwright
#         Chromium, if a session installs one.
SANDBOX_CACHE_VOLUMES="gradle:/home/dev/.gradle m2:/home/dev/.m2 pw:/home/dev/.cache/ms-playwright"

SANDBOX_NPM_DIRS=""
SANDBOX_ENV=""
SANDBOX_RUN_ARGS=""

# Days of Claude session history to keep (see the template).
SANDBOX_HISTORY_DAYS=14
