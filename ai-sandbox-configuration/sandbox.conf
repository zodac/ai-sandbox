# The sandbox settings for ai-sandbox's OWN checkout, read by ./sandbox.sh on every launch. This repo
# is its own sandbox, running its working tree (see self_hosted in sandbox.sh), so an edit to image/ or
# sandbox.sh takes effect at the next launch - and a broken one breaks this sandbox too: fix it from
# the host.
#
# Plain bash, sourced on the HOST. Every value is a space-separated string (SANDBOX_ENV and
# SANDBOX_BUILD_ARGS may be bash arrays instead), and an environment variable of the same name
# overrides it for one launch (`SANDBOX_PORTS= ./sandbox.sh`). See README.md for the full reference.

# Ports published to the host, as `host:container` pairs. Empty publishes nothing - two sandboxes
# cannot both hold the same host port, so only publish what a session actually serves.
SANDBOX_PORTS=""

# Named cache volumes, as `name:/container/path` pairs - each survives the sandbox's teardown as
# the docker volume `<sandbox-name>-<name>`. For example:
#   "m2:/home/dev/.m2 gradle:/home/dev/.gradle pw:/home/dev/.cache/ms-playwright"
SANDBOX_CACHE_VOLUMES=""

# Directories (relative to the project root, "." = the root) whose package.json gets an
# `npm ci` (`npm install` without a lockfile) on each interactive open, re-run only when its
# package-lock.json changes.
SANDBOX_NPM_DIRS=""

# Extra environment for the sandbox, as KEY=VALUE pairs. For a value with spaces, use an array:
#   SANDBOX_ENV=("GREETING=hello there" "LEVEL=debug")
SANDBOX_ENV=""

# Build args for this directory's Dockerfile, as KEY=VALUE pairs (or an array, as above). The build
# context stops at this directory, and this file is bash, so this is how a version can come from the
# rest of the project. examples/java-maven reads its Playwright version this way.
SANDBOX_BUILD_ARGS=""

# Extra `docker run` flags, passed through as-is (e.g. "--shm-size 2g").
SANDBOX_RUN_ARGS=""

# Days of Claude session history (transcripts, file history, tool results) to keep in
# .claude-history; anything older is deleted when Claude starts. Memory and settings are always kept.
SANDBOX_HISTORY_DAYS=14

# Whether Claude starts its Remote Control bridge with each session (true or false).
SANDBOX_REMOTE_CONTROL=true

# Pin the docker name prefix instead of deriving it from this checkout's path (rarely needed).
# SANDBOX_NAME=""

# The sandbox's timezone (an IANA name); defaults to the host's.
# SANDBOX_TZ=""
