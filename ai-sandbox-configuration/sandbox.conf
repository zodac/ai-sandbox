# The sandbox settings for ai-sandbox's OWN checkout, read by ./sandbox.sh on every launch. This repo
# is its own sandbox, running its working tree (see self_hosted in sandbox.sh), so an edit to image/ or
# sandbox.sh takes effect at the next launch - and a broken one breaks this sandbox too: fix it from
# the host.
#
# Plain bash, sourced on the HOST. Every value is a space-separated string (SANDBOX_ENV and
# SANDBOX_BUILD_ARGS may be bash arrays instead), and an environment variable of the same name
# overrides it for one launch (`SANDBOX_PORTS= ./sandbox.sh`). See README.md for the full reference.

# Ports published to the host, as `host:container` pairs. Empty publishes nothing - two sandboxes
# cannot both hold the same host port, so only publish what a session actually serves. They are on the
# host's loopback (127.0.0.1) only; name an address to publish elsewhere: "0.0.0.0:8071:8081" is the LAN.
SANDBOX_PORTS=""

# Named cache volumes, as `name:/container/path` pairs - each survives the sandbox's teardown as
# the docker volume `<sandbox-name>-<name>`. For example:
#   "m2:/home/dev/.m2 gradle:/home/dev/.gradle pw:/home/dev/.cache/ms-playwright"
SANDBOX_CACHE_VOLUMES=""

# Directories (relative to the project root, "." = the root) whose package.json gets an
# `npm ci` (`npm install` without a lockfile) on each interactive open, re-run only when its
# package-lock.json changes.
SANDBOX_NPM_DIRS=""

# Extra environment for the sandbox, as KEY=VALUE pairs. For a value with spaces, use an array:
#   SANDBOX_ENV=("GREETING=hello there" "LEVEL=debug")
SANDBOX_ENV=""

# Build args for this directory's Dockerfile, as KEY=VALUE pairs (or an array, as above). The build
# context stops at this directory, and this file is bash, so this is how a version can come from the
# rest of the project. examples/java-maven reads its Playwright version this way.
SANDBOX_BUILD_ARGS=""

# Extra `docker run` flags, passed through as-is (e.g. "--shm-size 2g").
SANDBOX_RUN_ARGS=""

# Days of Claude session history (transcripts, file history, tool results) to keep in
# .claude-history; anything older is deleted when Claude starts. Memory and settings are always kept.
SANDBOX_HISTORY_DAYS=14

# Whether Claude starts its Remote Control bridge with each session (true or false).
SANDBOX_REMOTE_CONTROL=true

# Whether the running Claude session gets each image `sandbox.sh paste-image` saves by itself, with no
# Ctrl+V of its path (true or false).
SANDBOX_PASTE_CHANNEL=true

# Host devices passed in, as /dev paths (e.g. "/dev/kvm" for an Android emulator). The sandbox is not
# --privileged, so it sees no other host device; one this host lacks is skipped with a warning.
SANDBOX_DEVICES=""

# The most processes (threads included) the sandbox may run at once, nested containers too, or
# "unlimited". Memory and CPU are unlimited; limit them in SANDBOX_RUN_ARGS ("--memory 16g").
SANDBOX_PIDS_LIMIT=32768

# Whether the sandbox is kept off the host's local network (true or false): connections to the LAN, the
# host itself and link-local addresses (cloud metadata) are refused; the internet and DNS are not.
SANDBOX_BLOCK_LOCAL_NETWORK=true

# IP addresses or CIDRs on the local network to let through anyway (e.g. "192.168.1.20 10.8.0.0/16").
SANDBOX_LOCAL_NETWORK_ALLOW=""

# Run the sandbox --privileged, as ai-sandbox did before 1.3.0: every host device (the raw disks
# included) and capability. Only for tooling that cannot work without it.
# SANDBOX_PRIVILEGED=false

# Whether `dev` has passwordless sudo (true or false). Off by default: with sudo, any command in a
# session could undo the network block and the read-only protection below.
SANDBOX_SUDO=false

# The files the HOST runs or loads, mounted read-only in the sandbox (see the template's comment). This
# repo runs its OWN working tree, so the default list does not fit: sandbox.sh, .claude/settings.json
# (it registers rules/hooks) and .idea/runConfigurations are what work here edits, and the host runs
# them all - review every change to them before running anything on the host. Protected are only the
# ones no task here needs to change.
SANDBOX_PROTECTED_PATHS=".git/hooks .git/modules/code-quality-config/hooks .claude/settings.local.json .claude/hooks .vscode .envrc"

# Pin the docker name prefix instead of deriving it from this checkout's path (rarely needed).
# SANDBOX_NAME=""

# The sandbox's timezone (an IANA name); defaults to the host's.
# SANDBOX_TZ=""
